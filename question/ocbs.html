<script>
    class Vehicle {
        constructor(vehicleNo, driverName, distance) {
            this.vehicleNo = vehicleNo;
            this.driverName = driverName;
            this.distance = distance;
        }

        static displayPlatform() {
            document.write("<h2>Welcome to QuickCab Booking System</h2>");
        }

        calculateFare() {
            return 0;
        }

            document.write("Vehicle No: " + this.vehicleNo + "<br>");
            document.write("Driver Name: " + this.driverName + "<br>");

        }
    }

    class Car extends Vehicle {
        constructor(vehicleNo, driverName, distance) {
            super(vehicleNo, driverName, distance);
        }

        calculateFare() {
            return this.distance * 15;

        displayDetails() {
            super.displayDetails();
            document.write("Vehicle Type: Car (Rs. 15/km)<br>");
            document.write("Total Fare: Rs. " + this.calculateFare() + "<br><hr>");
        }
    }

    class Bike extends Vehicle {
