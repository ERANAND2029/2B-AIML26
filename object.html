<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript String Methods</title>
</head>

<body>

<script>

    // 1. String banana

    let name = "Anand";

    let Last = new String();
    Last = "Rai";

    console.log("Name:", name);
    console.log("Last Name:", Last);


    // 2. toUpperCase()

    console.log(name.toUpperCase());
    console.log(Last.toUpperCase());


    // 3. toLowerCase()

    console.log(name.toLowerCase());
    console.log(Last.toLowerCase());


    // 4. charAt()

    console.log(name.charAt(0));
    console.log(name.charAt(1));
    console.log(Last.charAt(0));


    // 5. indexOf()

    console.log(name.indexOf("a"));
    console.log(name.indexOf("n"));
    console.log(Last.indexOf("R"));


    // 6. lastIndexOf()

    console.log(name.lastIndexOf("n"));
    console.log(name.lastIndexOf("a"));


    // 7. slice()

    console.log(name.slice(0, 3));
    console.log(Last.slice(0, 2));


    // 8. split("")

    console.log(name.split(""));
    console.log(Last.split(""));


    // 9. split(" ")

    let fullName = "Anand Rai";

    console.log(fullName.split(" "));


    // 10. includes()

    console.log(name.includes("An"));
    console.log(name.includes("and"));
    console.log(name.includes("Rahul"));


    // 11. replace()

    console.log(name.replace("Anand", "Rahul"));
    console.log(Last.replace("Rai", "Sharma"));


    // 12. concat()

    console.log(name.concat(" ", Last));

</script>

</body>
</html>
