<body>

    <script>

        function Sum (...value)
        {
            let total = 0;

            for (let n of value)
            {
                total = total + n;
            }

            return total;
        }

        console.log(Sum(10,20,20,20));
        console.log(Sum(39,39,49,29,49));

    </script>

</body>
